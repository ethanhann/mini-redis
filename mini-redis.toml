# A sample mini-redis server configuration.
#
# Start the server with it using:
#
#     mini-redis-server --config mini-redis.toml
#
# Every setting below is optional. Omit one and it takes the default shown.
# A flag passed on the command line wins over the value here, so
# `--port 7000` overrides the port this file sets.

# The IP address the listener binds to. Use "0.0.0.0" to accept connections
# from any interface.
bind_address = "127.0.0.1"

# The TCP port the listener binds to. A port below 1024 is accepted with a
# warning, because binding one needs elevated permission.
port = 6379

# The tracing verbosity, one of "trace", "debug", "info", "warn", or "error".
# Setting RUST_LOG overrides this.
log_level = "info"

# Bounds on what the accept loop will do. Omit the whole block to take both
# defaults.
[limits]

# How many connections may be open at once. The listener stops accepting once
# this many are active and resumes when one closes.
max_connections = 250

# How long the accept loop may wait between retries. The wait starts at one
# second and doubles after each failure. Once a wait would exceed this, the
# server stops rather than retrying again.
max_backoff_seconds = 64
